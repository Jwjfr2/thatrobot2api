[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "thatrobot2api"
version = "0.1.0"
description = "OpenAI-compatible reverse proxy for platform.thatrobot.ai"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[project.scripts]
thatrobot2api = "thatrobot2api.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/thatrobot2api"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
